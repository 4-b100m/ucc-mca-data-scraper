version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/apps/desktop'
      - '/apps/mobile'
      - '/apps/web'
      - '/packages/core'
      - '/packages/ui'
      - '/cloudflare'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      github-actions-deps:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: 'docker'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: 'cargo'
    directories:
      - '/apps/desktop/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      cargo-deps:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
