# ============================================================================
# Deploy ucc-mca-edge (Cloudflare Workers)
# ----------------------------------------------------------------------------
# Strangler-pattern edge deploy, fully scoped to the cloudflare/ directory.
#   * push to main          → auto-deploy to STAGING
#   * workflow_dispatch      → deploy to PRODUCTION (requires confirm == DEPLOY)
#
# Secrets required (repo or environment scope):
#   CLOUDFLARE_API_TOKEN   — least-privilege token. Grant ONLY:
#                            Account · Workers Scripts:Edit,
#                            Account · D1:Edit, Account · Workers KV Storage:Edit,
#                            Account · Workers R2 Storage:Edit (+ Account:Read).
#                            Do NOT use a Global API Key.
#   CLOUDFLARE_ACCOUNT_ID  — required only for manual production deployment.
# Staging uses its API-verified account_id in cloudflare/wrangler.toml.
# ============================================================================
name: deploy-cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a PRODUCTION deploy'
        required: true
        default: ''

# Least privilege: the deploy needs only repo read.
permissions:
  contents: read

jobs:
  # --- STAGING: automatic on push to main -----------------------------------
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund

      - name: Install edge deps
        working-directory: cloudflare
        run: npm ci --ignore-scripts

      # Apply D1 migrations to the REMOTE staging DB BEFORE deploying the Worker,
      # so the new code never goes live against an unmigrated/stale schema.
      - name: Verify locked Cloudflare CLI starts
        run: node scripts/verify-cloudflare-toolchain.mjs

      - name: Confirm frozen dependency declarations
        run: git diff --exit-code -- cloudflare/package.json cloudflare/package-lock.json

      - name: Diagnose staging account access without changing resources
        # Diagnostic observations do not replace required deployment configuration.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(python3 -c 'import tomllib; print(tomllib.load(open("cloudflare/wrangler.toml", "rb"))["env"]["staging"]["account_id"])')"
          export CLOUDFLARE_ACCOUNT_ID
          python3 scripts/diagnose-cloudflare.py

      - name: Reject incomplete staging bindings before remote mutations
        run: python3 scripts/verify-cloudflare-staging.py

      - name: Apply D1 migrations (staging)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          ./node_modules/.bin/wrangler d1 migrations apply ucc-mca --env staging --remote

      - name: Deploy Worker (staging)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          ./node_modules/.bin/wrangler deploy --env staging

      # --- How the SPA (apps/web) Pages deploy would attach (left commented;
      #     this workflow stays scoped to the Worker for now) -----------------
      # - name: Build SPA
      #   run: npm ci && npm run build      # produces dist/ (apps/web)
      # - name: Deploy SPA to Pages
      #   uses: cloudflare/wrangler-action@v4
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy dist --project-name ucc-mca-web --branch=main

  # --- PRODUCTION: manual, gated on confirm == DEPLOY -----------------------
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund

      - name: Install edge deps
        working-directory: cloudflare
        run: npm ci --ignore-scripts

      - name: Verify locked Cloudflare CLI starts
        run: node scripts/verify-cloudflare-toolchain.mjs

      - name: Confirm frozen dependency declarations
        run: git diff --exit-code -- cloudflare/package.json cloudflare/package-lock.json

      - name: Apply D1 migrations (production)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is not configured}"
          ./node_modules/.bin/wrangler d1 migrations apply ucc-mca --env production --remote

      - name: Deploy Worker (production)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is not configured}"
          ./node_modules/.bin/wrangler deploy --env production
